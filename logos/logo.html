<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Generator Logo Estymator PNG</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #eef2f5; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        button { background: #d81b70; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 20px; }
        button:hover { background: #b01058; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Podgląd Logo Estymator</h2>
    
    <!-- Vector SVG matching image -->
    <svg id="logoSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="320" height="416">
        <defs>
            <style>
                .grid-line { stroke: #4a4d52; stroke-width: 1.5; opacity: 0.85; }
                .grid-node { fill: #383b42; }
                
                /* Pink 'E' line styling with rounded ends and joins */
                .e-path { stroke: #d81b70; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; fill: none; }
                
                /* Pink outer circle nodes with dark inner fill as in image */
                .e-node-outer { fill: #d81b70; }
                .e-node-inner { fill: #383b42; }
                
                .logo-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 44px; fill: #383b42; letter-spacing: -1px; }
            </style>
        </defs>

        <!-- GRID LINES -->

            <line x1="200" y1="40" x2="200" y2="300" class="grid-line" />
            <line x1="170" y1="52" x2="170" y2="288" class="grid-line" />
            <line x1="230" y1="52" x2="230" y2="288" class="grid-line" />
            <line x1="140" y1="88" x2="140" y2="252" class="grid-line" />
            <line x1="260" y1="88" x2="260" y2="252" class="grid-line" />
            <line x1="110" y1="130" x2="110" y2="210" class="grid-line" />
            <line x1="290" y1="130" x2="290" y2="210" class="grid-line" />

            <!-- Horizontal Lines -->

            <line x1="140" y1="88" x2="260" y2="88" class="grid-line" />
            <line x1="110" y1="130" x2="290" y2="130" class="grid-line" />
            <line x1="110" y1="170" x2="290" y2="170" class="grid-line" />
            <line x1="110" y1="210" x2="290" y2="210" class="grid-line" />
            <line x1="140" y1="252" x2="260" y2="252" class="grid-line" />
            <line x1="170" y1="288" x2="230" y2="288" class="grid-line" />

            <!-- Outer Oval Boundary Lines -->

            <line x1="200" y1="40" x2="230" y2="52" class="grid-line" />

            <line x1="230" y1="52" x2="260" y2="88" class="grid-line" />
            <line x1="140" y1="88" x2="110" y2="130" class="grid-line" />

            <line x1="110" y1="210" x2="140" y2="252" class="grid-line" />
            <line x1="290" y1="210" x2="260" y2="252" class="grid-line" />

            <line x1="260" y1="252" x2="230" y2="288" class="grid-line" />

            <line x1="230" y1="288" x2="200" y2="300" class="grid-line" />

            <!-- Inner Mesh Diagonals -->
            <!-- Row 1 Top -->

            <line x1="200" y1="40" x2="230" y2="88" class="grid-line" />
            <line x1="170" y1="52" x2="200" y2="88" class="grid-line" />
            <line x1="230" y1="52" x2="200" y2="88" class="grid-line" />
            <line x1="170" y1="52" x2="140" y2="130" class="grid-line" />

            <line x1="170" y1="130" x2="200" y2="170" class="grid-line" />
            <line x1="200" y1="130" x2="230" y2="170" class="grid-line" />
            <line x1="230" y1="130" x2="260" y2="170" class="grid-line" />

            <line x1="170" y1="130" x2="140" y2="170" class="grid-line" />
            <line x1="200" y1="130" x2="170" y2="170" class="grid-line" />
            <line x1="230" y1="130" x2="200" y2="170" class="grid-line" />
            <line x1="260" y1="130" x2="230" y2="170" class="grid-line" />
            <line x1="290" y1="130" x2="260" y2="170" class="grid-line" />

            <!-- Row 4 Middle-Bottom -->
            <line x1="110" y1="170" x2="140" y2="210" class="grid-line" />
            <line x1="140" y1="170" x2="170" y2="210" class="grid-line" />
            <line x1="170" y1="170" x2="200" y2="210" class="grid-line" />
            <line x1="200" y1="170" x2="230" y2="210" class="grid-line" />

            <line x1="260" y1="170" x2="290" y2="210" class="grid-line" />

            <line x1="140" y1="170" x2="110" y2="210" class="grid-line" />
            <line x1="170" y1="170" x2="140" y2="210" class="grid-line" />
            <line x1="200" y1="170" x2="170" y2="210" class="grid-line" />
            <line x1="230" y1="170" x2="200" y2="210" class="grid-line" />
            <line x1="260" y1="170" x2="230" y2="210" class="grid-line" />

            <line x1="230" y1="210" x2="200" y2="252" class="grid-line" />
            <line x1="260" y1="210" x2="230" y2="252" class="grid-line" />

            <line x1="290" y1="170" x2="260" y2="252" class="grid-line" />

            <line x1="230" y1="252" x2="200" y2="288" class="grid-line" />
            <line x1="200" y1="252" x2="170" y2="288" class="grid-line" />

            <line x1="170" y1="252" x2="200" y2="300" class="grid-line" />
            <line x1="230" y1="252" x2="200" y2="300" class="grid-line" />
        </g>

        <!-- GRID NODES -->
        <g id="grid-nodes">
            <!-- Row y=40 -->
            <circle cx="200" cy="40" r="3.5" class="grid-node" />
            <!-- Row y=52 -->

            <circle cx="170" cy="88" r="3.5" class="grid-node" />
            <circle cx="200" cy="88" r="3.5" class="grid-node" />
            <circle cx="230" cy="88" r="3.5" class="grid-node" />
            <circle cx="260" cy="88" r="3.5" class="grid-node" />
            <!-- Row y=130 -->

            <!-- Row y=210 -->

            <circle cx="140" cy="210" r="3.5" class="grid-node" />
            <circle cx="170" cy="210" r="3.5" class="grid-node" />
            <circle cx="200" cy="210" r="3.5" class="grid-node" />
            <circle cx="230" cy="210" r="3.5" class="grid-node" />
            <circle cx="260" cy="210" r="3.5" class="grid-node" />
            <circle cx="290" cy="210" r="3.5" class="grid-node" />
            <!-- Row y=252 -->
            <circle cx="140" cy="252" r="3.5" class="grid-node" />
            <circle cx="170" cy="252" r="3.5" class="grid-node" />
            <circle cx="200" cy="252" r="3.5" class="grid-node" />
            <circle cx="230" cy="252" r="3.5" class="grid-node" />
            <circle cx="260" cy="252" r="3.5" class="grid-node" />
            <!-- Row y=288 -->
            <circle cx="170" cy="288" r="3.5" class="grid-node" />
            <circle cx="200" cy="288" r="3.5" class="grid-node" />
            <circle cx="230" cy="288" r="3.5" class="grid-node" />
            <!-- Row y=300 -->
            <circle cx="200" cy="300" r="3.5" class="grid-node" />
        </g>

        <!-- PINK HIGHLIGHTED 'E' PATH (Matching Exact Original Image Geometry) -->
        <g id="pink-e">
            <!-- 
                Vertical spine: (170,88) -> (170,130) -> (170,170) -> (170,252)
                Top Bar: (170,88) -> (230,52)
                Middle Bar: (170,130) -> (230,130)  --- or angled (170,170)->(230,130)
                Bottom Bar: (170,252) -> (230,210)
            -->
            <path d="M 230,52 L 170,88 L 170,252 L 230,210 M 170,170 L 230,130" class="e-path" />
            
            <!-- Nodes with dark inner core matching image style -->
            <!-- Top Right -->
            <circle cx="230" cy="52" r="9" class="e-node-outer" />
            <circle cx="230" cy="52" r="4.5" class="e-node-inner" />

            <!-- Top Left Spine -->
            <circle cx="170" cy="88" r="9" class="e-node-outer" />
            <circle cx="170" cy="88" r="4.5" class="e-node-inner" />

            <!-- Mid Spine Junction -->
            <circle cx="170" cy="170" r="9" class="e-node-outer" />
            <circle cx="170" cy="170" r="4.5" class="e-node-inner" />

            <!-- Mid Right -->
            <circle cx="230" cy="130" r="9" class="e-node-outer" />
            <circle cx="230" cy="130" r="4.5" class="e-node-inner" />

            <!-- Bottom Left Spine -->
            <circle cx="170" cy="252" r="9" class="e-node-outer" />
            <circle cx="170" cy="252" r="4.5" class="e-node-inner" />

            <!-- Bottom Right -->
            <circle cx="230" cy="210" r="9" class="e-node-outer" />
            <circle cx="230" cy="210" r="4.5" class="e-node-inner" />
        </g>

        <!-- LOGO TEXT -->
        <text x="200" y="380" text-anchor="middle" class="logo-text">estymator</text>
    </svg>

    <br>
    <button onclick="downloadPNG()">Pobierz logo jako przezroczysty PNG</button>
</div>

<canvas id="canvas" width="1200" height="1560"></canvas>

<script>
    function downloadPNG() {
        const svg = document.getElementById('logoSvg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const svgData = new XMLSerializer().serializeToString(svg);
        const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);
        
        const image = new Image();
        image.onload = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            
            const png = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.href = png;
            downloadLink.download = 'estymator-logo-transparent.png';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        };
        image.src = blobURL;
    }
</script>

</body>
</html>
