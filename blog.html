<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog · Estymator · PWr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,700;1,300&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,900;1,9..144,300;1,9..144,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* blog-page hero */
.blog-hero {
  background: var(--black);
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(5rem, 10vw, 10rem) 3rem;
  text-align: center;
  border-bottom: 1px solid rgba(222,192,173,.08);
  position: relative;
  overflow: hidden;
}
.blog-hero .section-label { font-size:.6rem; letter-spacing:.3em; text-transform:uppercase; color:var(--G); margin-bottom:1rem; }
.blog-hero h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(3.5rem,8vw,7rem); line-height:.9; letter-spacing:.04em; }
.blog-hero h1 span { color:var(--R); }
.blog-hero p { font-size:.82rem; color:rgba(235,235,233,.45); max-width:500px; margin:1.5rem auto 0; line-height:1.7; }

/* filters */
.blog-filters {
  display:flex; align-items:center; justify-content:center; gap:.5rem;
  padding:2rem 1.5rem; flex-wrap:wrap;
  background:rgba(0,0,0,.2); border-bottom:1px solid rgba(222,192,173,.06);
}
.blog-filters button {
  font-family:'IBM Plex Mono',monospace; font-size:.62rem; letter-spacing:.12em;
  text-transform:uppercase; padding:.5rem 1rem;
  background:transparent; border:1px solid rgba(222,192,173,.15);
  color:rgba(235,235,233,.45); cursor:pointer; transition:all .2s;
}
.blog-filters button:hover,.blog-filters button.active {
  border-color:var(--G); color:var(--G); background:rgba(232,167,132,.06);
}

/* grid area */
.blog-area { padding:3rem; min-height:40vh; }
.blog-area .blog-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; }

/* empty */
.blog-empty-page { text-align:center; padding:6rem 2rem; color:rgba(235,235,233,.12); }
.blog-empty-page svg { width:80px; height:80px; stroke:rgba(235,235,233,.1); margin-bottom:1rem; }
.blog-empty-page p { font-size:.85rem; }

@media(max-width:1024px){ .blog-hero{min-height:45vh} .blog-area .blog-grid{grid-template-columns:repeat(2,1fr)} }
@media(max-width:600px){
  .blog-hero{min-height:40vh;padding:4rem 1.4rem}
  .blog-area{padding:2rem 1.4rem}
  .blog-area .blog-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="cur"></div>
<div id="cur2"></div>

<nav role="navigation" aria-label="Główna nawigacja">
  <a href="index.html" class="nlogo" aria-label="Estymator — strona główna">ESTYMATOR</a>
  <button class="nav-toggle" aria-label="Otwórz menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <ul class="nlinks">
    <li><a href="studenci.html">Dla studentów</a></li>
    <li><a href="firmy.html">Dla firm</a></li>
    <li><a href="blog.html" class="active">Blog</a></li>
    <li><a href="admin.html" style="font-size:.6rem;opacity:.35;letter-spacing:.15em">ADMIN</a></li>
    <li><a href="index.html#join" class="ncta">Dołącz →</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="blog-hero">
  <div class="section-label">Najnowsze wpisy</div>
  <h1>Blog <span>koła</span></h1>
  <p>Relacje z wydarzeń, wyniki badań, ogłoszenia i artykuły pisane przez członków Estymatora.</p>
</section>

<div class="color-strip"><div class="cs1"></div><div class="cs2"></div><div class="cs3"></div><div class="cs4"></div><div class="cs5"></div><div class="cs6"></div></div>

<!-- FILTERS -->
<div class="blog-filters" id="blogFilters">
  <button class="active" data-filter="all">Wszystkie</button>
  <button data-filter="news">Aktualności</button>
  <button data-filter="event">Wydarzenia</button>
  <button data-filter="research">Badania</button>
  <button data-filter="workshop">Warsztaty</button>
</div>

<!-- POSTS -->
<section class="blog-area">
  <div class="blog-grid rv-stagger" id="blogContainer"></div>
  <div class="blog-empty-page" id="blogEmpty" style="display:none">
    <svg viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <p>Brak postów w tej kategorii</p>
  </div>
</section>

<!-- FOOTER (compact) -->
<footer style="background:var(--black);padding:3rem;text-align:center;border-top:1px solid rgba(222,192,173,.08)">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.1em;color:var(--G);margin-bottom:.4rem">ESTYMATOR</div>
  <div style="font-size:.65rem;color:rgba(235,235,233,.25)">SKN ML/AI · WIT · Politechnika Wrocławska · © 2025</div>
</footer>

<script src="shared.js"></script>
<script src="js/posts-loader.js"></script>
<script>
(function(){
  var container = document.getElementById('blogContainer');
  var emptyEl = document.getElementById('blogEmpty');
  var currentFilter = 'all';

  function renderFiltered(category) {
    currentFilter = category;
    var posts = window.EstymatorBlog.getPosts();
    if (category !== 'all') {
      posts = posts.filter(function(p){ return p.category === category; });
    }
    if (posts.length === 0) {
      container.innerHTML = '';
      emptyEl.style.display = 'block';
    } else {
      emptyEl.style.display = 'none';
      // Reuse the render function with no limit
      container.setAttribute('data-blog-category', category === 'all' ? '' : category);
      window.EstymatorBlog.render(container, 0, category === 'all' ? null : category);
    }
  }

  // Filter buttons
  document.getElementById('blogFilters').addEventListener('click', function(e){
    if (e.target.tagName === 'BUTTON') {
      document.querySelectorAll('#blogFilters button').forEach(function(b){ b.classList.remove('active'); });
      e.target.classList.add('active');
      renderFiltered(e.target.dataset.filter);
    }
  });

  // Initial render
  renderFiltered('all');
})();
</script>
</body>
</html>
